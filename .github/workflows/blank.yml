name: HTML to APK Builder

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Convert Web Files to APK
      uses: darkshredder/web-to-app-action@main
      with:
        # "." ka matlab aapki saari HTML files root (main) folder me hain
        build-folder-path: "." 
        app-name: "MyNewApp"
        output-folder-path: "my-apks"

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: final-android-apk
        path: my-apks/
