name: Pure HTML to APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Custom Android Project Wrapper
      run: |
        mkdir -p android/app/src/main/assets/www
        mkdir -p android/app/src/main/java/com/simplehtml/app
        mkdir -p android/app/src/main/res/layout
        mkdir -p android/gradle/wrapper

        # Apni saari web files ko android build asset folder me copy karein
        rsync -rr --exclude='android' --exclude='.git' --exclude='.github' ./ android/app/src/main/assets/www/

        # Simple Build Gradle configuration create karein
        cat << 'EOF' > android/build.gradle
        buildscript {
            repositories { google() { maven { url 'https://google.com' } }; mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects { repositories { google() { maven { url 'https://google.com' } }; mavenCentral() } }
        EOF

        cat << 'EOF' > android/settings.gradle
        include ':app'
        EOF

        cat << 'EOF' > android/app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.simplehtml.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.simplehtml.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        # WebView Layout configuration setup karein
        cat << 'EOF' > android/app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <android.webkit.WebView xmlns:android="http://android.com"
            xmlns:app="http://android.com"
            android:id="@+id/webview"
            android:layout_width="match_parent"
            android:layout_height="match_parent" />
        EOF

        # Android Manifest configuration setup karein
        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:allowBackup="true" android:label="MyHTMLApp" android:theme="@android:style/Theme.NoTitleBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Pure Java code build karein jo index.html ko render karega
        cat << 'EOF' > android/app/src/main/java/com/simplehtml/app/MainActivity.java
        package com.simplehtml.app;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState) {
                    WebView webView = new WebView(this);
                    webView.getSettings().setJavaScriptEnabled(true);
                    webView.getSettings().setDomStorageEnabled(true);
                    webView.setWebViewClient(new WebViewClient());
                    webView.loadUrl("file:///android_asset/www/index.html");
                    setContentView(webView);
                }
            }
        }
        EOF

    - name: Download Gradle and Build Pure APK
      run: |
        cd android
        wget -q https://gradle.org
        unzip -q gradle-8.5-bin.zip
        ./gradle-8.5/bin/gradle assembleDebug

    - name: Upload Native Android APK
      uses: actions/upload-artifact@v4
      with:
        name: my-final-apk
        path: android/app/build/outputs/apk/debug/*.apk
