name: Build Android APK with Capacitor

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Yahan hum explicitly Node.js 22 set kar rahe hain jo Capacitor ko chahiye
    - name: Setup Node.js (v22)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Project Dependencies
      run: |
        npm install
        # Agar capacitor install na ho toh use automatic force install karein
        npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "android/gradlew" ]; then
          chmod +x android/gradlew
        fi

    - name: Build Web Assets and Sync Capacitor
      run: |
        # Agar aapke paas build script hai toh npx cap sync se pehle chalti hai
        npm run build --if-present 
        npx cap sync android

    - name: Build Android Debug APK
      run: |
        cd android && ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: final-android-apk
        path: android/app/build/outputs/apk/debug/*.apk
