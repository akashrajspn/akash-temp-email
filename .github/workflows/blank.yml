name: Build Android APK

on:
  push:
    branches: [ "main" ] # Jab aap main branch par push karenge tab chalega

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5 # Node.js 24 supported latest version

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # (Optional) Agar Flutter project hai toh yeh step add karein:
    # - name: Setup Flutter
    #   uses: subosito/flutter-action@v2
    #   with:
    #     flutter-version: 'any'

    # (Optional) Agar React Native project hai toh dependencies install karein:
    # - name: Install Dependencies
    #   run: npm install

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      continue-on-error: true # Agar direct android folder na ho toh error na aaye

    - name: Build APK
      run: |
        if [ -d "android" ]; then
          cd android && ./gradlew assembleDebug
        elif [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -f "pubspec.yaml" ]; then
          flutter build apk --debug
        else
          echo "No Android project setup found!" && exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
