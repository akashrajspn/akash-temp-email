<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akash Raj</title>
<style>
body { font-family: sans-serif; background:#f2f2f2; text-align:center; padding:20px; }
h2 {
  font-size:26px;
  background: linear-gradient(270deg, #ff6ec4, #7873f5, #4ade80, #ff6ec4);
  background-size: 800% 800%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradientMove 4s ease infinite;
}
@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
#email { font-size:20px; font-weight:bold; background:white; padding:12px; border-radius:8px; margin:15px 0; }
button { padding:10px 18px; margin:5px; border:none; border-radius:8px; background:#333; color:white; font-size:15px; }
.msg { background:white; margin:10px 0; padding:10px; border-radius:8px; text-align:left; }
</style>
</head>
<body>
<h2>Akash Raj</h2>
<div id="email">Loading...</div>
<button onclick="newEmail()">Naya Email</button>
<button onclick="copyEmail()">Copy</button>
<button onclick="checkInbox()">Inbox Check Karo</button>
<div id="inbox"></div>

<script>
let name, domain;
const domains = ["1secmail.com","1secmail.net","1secmail.org"];
let autoRefresh;

function newEmail() {
  name = Math.random().toString(36).substring(2, 10);
  domain = domains[Math.floor(Math.random()*domains.length)];
  document.getElementById('email').innerText = name + "@" + domain;
  document.getElementById('inbox').innerHTML = "";

  clearInterval(autoRefresh);
  autoRefresh = setInterval(checkInbox, 10000);
}

function copyEmail() {
  const email = document.getElementById('email').innerText;
  navigator.clipboard.writeText(email).then(() => {
    alert("Email copy ho gaya: " + email);
  });
}

async function checkInbox() {
  const url = `https://www.1secmail.com/api/v1/?action=getMessages&login=${name}&domain=${domain}`;
  const res = await fetch(url);
  const messages = await res.json();
  const box = document.getElementById('inbox');
  box.innerHTML = "";
  if (messages.length === 0) {
    box.innerHTML = "<p>Koi mail nahi aaya abhi.</p>";
    return;
  }
  for (const m of messages) {
    const readUrl = `https://www.1secmail.com/api/v1/?action=readMessage&login=${name}&domain=${domain}&id=${m.id}`;
    const full = await (await fetch(readUrl)).json();
    box.innerHTML += `<div class="msg"><b>From:</b> ${full.from}<br><b>Subject:</b> ${full.subject}<br><b>Message:</b> ${full.textBody || full.body}</div>`;
  }
}

newEmail();
</script>
</body>
</html>
